pluginManagement {
    def rnPackage = new File(providers.exec { commandLine 'node', '-p', "require.resolve('react-native/package.json')" }.standardOutput.asText.get().trim())
    def gradlePackage = new File(providers.exec { commandLine 'node', '-p', "require.resolve('@react-native/gradle-plugin/package.json', {paths: [" + groovy.json.JsonOutput.toJson(rnPackage.parent) + "]})" }.standardOutput.asText.get().trim())
    includeBuild(gradlePackage.parent)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand(["node", file("../node_modules/@react-native-community/cli/build/bin.js").absolutePath, "config"], file("..")) }
rootProject.name = 'HelloWorld'
include ':app'
def rnGradlePackage = new File(providers.exec {
    commandLine 'node', '-p', "require.resolve('@react-native/gradle-plugin/package.json', {paths: [require.resolve('react-native/package.json')]})"
}.standardOutput.asText.get().trim())
includeBuild(rnGradlePackage.parent)
